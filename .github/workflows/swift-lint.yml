on:
  workflow_call:

jobs:
  lint:
    name: "swiftlint"
    runs-on: macos-latest
    env:
      # Install, and auto-install, only this tool (mise.toml pins the others too).
      MISE_ENABLE_TOOLS: swiftlint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise and swiftlint
        uses: jdx/mise-action@v5

      - name: Run lint
        run: mise run swift-lint
