on:
  workflow_call:

jobs:
  build:
    name: "cargo build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install: false # only the task runner is needed; the Swift tools are macOS-only

      - name: Build
        run: mise run rust-build
