on:
  workflow_call:

jobs:
  format-check:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise and the Rust toolchain
        uses: jdx/mise-action@v5 # installs Rust from rust-toolchain.toml; the Swift tools are macOS-only

      - name: Run format check
        run: mise run rust-format-check
