on:
  workflow_call:

jobs:
  format-check:
    name: "cargo fmt"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install: false # only the task runner is needed; the Swift tools are macOS-only

      - name: Run format check
        run: mise run rust-format-check
