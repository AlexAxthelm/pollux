on:
  workflow_call:

jobs:
  lint:
    name: "cargo clippy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install: false # only the task runner is needed; the Swift tools are macOS-only

      - name: Run lint
        run: mise run rust-lint
