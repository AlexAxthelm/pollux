on:
  workflow_call:

jobs:
  lock-check:
    name: "Cargo.lock up to date"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mise and the Rust toolchain
        uses: jdx/mise-action@v5 # installs Rust from rust-toolchain.toml; the Swift tools are macOS-only

      - name: Check lockfile is up to date
        run: mise run rust-lock-check
