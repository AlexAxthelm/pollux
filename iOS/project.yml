# /iOS/project.yml
name: Pollux
packages:
  Shared:
    path: ./generated/Shared
  App:
    path: ./generated/App
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"
options:
  bundleIdPrefix: com.example.pollux
attributes:
  BuildIndependentTargetsInParallel: true
targets:
  Pollux:
    type: application
    platform: iOS
    deploymentTarget: 18.0
    sources: [Pollux]
    dependencies:
      - package: Shared
      - package: App
      - package: GRDB
        product: GRDB

  PolluxTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [PolluxTests]
    dependencies:
      - target: Pollux
